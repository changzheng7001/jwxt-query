  /* 唐韵:表头金线由CSS border承载(清晰);文字浮上 */
  .head-imgM{position:absolute;inset:0;z-index:5;background-size:100% 100%;background-position:center top;background-repeat:no-repeat}
  .head>*{position:relative;z-index:6}
  .pane-bgs{position:absolute;inset:0;z-index:0}
  .pane-headbg{position:absolute;top:84px;left:0;right:0;height:62px;background-size:100% 100%;background-position:center top;background-repeat:no-repeat;z-index:3} /* 边框/波浪独立层浮于head蒙版之上,不被盖(清晰可见) */
  .pane-bg{position:absolute;top:84px;left:0;right:0;bottom:0;background-size:100% 100%;background-position:center top;background-repeat:no-repeat} /* 背景从表头(84px)开始,只铺课表区(表头+表格+节次列),不覆盖顶部按钮区 */
  .pane-gifB{position:absolute;left:0;right:0;bottom:0;height:230px;background-size:100% 100%;background-position:center bottom;background-repeat:no-repeat;pointer-events:none;z-index:1}
  /* 顶部固定小动图（左上角，70x43dp，原版 marginStart=88 在周次右侧，不随课表滑动） */
  .gifT-layer{position:absolute;top:6px;left:88px;width:70px;height:43px;background-size:100% 100%;background-position:center;background-repeat:no-repeat;pointer-events:none;display:none;z-index:2}
  /* 顶部栏（透明浮层，固定在背景之上） */
  .top{position:absolute;top:0;left:0;right:0;z-index:20;background:transparent;flex:0 0 auto;padding:0 15px}
  .rl-top{position:relative;height:84px;padding-top:8px}
  .ll-week{position:absolute;left:0;top:30px;display:flex;align-items:center;gap:6px;cursor:pointer;z-index:8;padding:4px 14px 4px 4px;border-radius:8px}
  .t-week{font-size:18px;font-weight:700;color:#333;line-height:1}
  .t-week.red{color:#FF5959}
  .week-arrow{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid #333;display:block}
  .week-arrow.red{border-top-color:#FF5959}
  .t-sem{position:absolute;left:0;top:58px;font-size:13px;color:rgba(255,255,255,.95);text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .top-acts{position:absolute;right:0;top:31px;display:flex;align-items:center}
  .t-ic{width:22px;height:22px;display:block;margin-left:10px;cursor:pointer;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
  .t-ic img{width:100%;height:100%;display:block}
  /* 周次弹窗（底部弹出 BottomSheet，原版 dialog_select_week） */
  .week-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:44;display:none}
  .week-mask.show{display:block}
  .week-pop{position:fixed;left:0;right:0;bottom:0;z-index:45;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,.15);padding:18px 18px 28px;display:none}
  .week-pop.show{display:block}
  .wp-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 18px}
  .wp-title{font-size:20px;font-weight:700;color:#1a1a1a;flex:1;text-align:center}
  .wp-edit{font-size:17px;color:#333;cursor:pointer;white-space:nowrap}
  .wp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .wp-cell{aspect-ratio:1.6/1;display:flex;align-items:center;justify-content:center;font-size:18px;color:#1a1a1a;background:#f1f5fa;border-radius:12px;cursor:pointer;font-weight:500}
  .wp-cell:active{background:#e6ecf4}
  .wp-cell.cur{background:#9aa0a8;color:#fff;font-weight:700}
  .wp-cell.sel{background:#ff4d4f;color:#fff;font-weight:700}
  /* ============ ViewPager 主体（占满全屏，含表头+节次+课程整页滑） ============ */
  .vp{position:absolute;inset:0;overflow:hidden;z-index:4}
  .vp-track{display:flex;height:100%}
  .vp-pane{flex:0 0 100%;min-width:100%;display:flex;flex-direction:column;position:relative;padding-top:84px}
  /* 表头（原版=横条imgM背景，独立不延伸，白字/当天黄字由主题决定） */
  .head{display:flex;height:62px;border-bottom:none;flex:0 0 auto;position:relative;z-index:2;background-size:100% 100%;background-position:center top;background-repeat:no-repeat}
  .h-month{width:12.5%;flex:0 0 12.5%;display:flex;align-items:center;justify-content:center;background:transparent;font-size:17px;font-weight:700;color:var(--hd-week,#000)}
  .h-days{flex:1;display:flex;background:transparent}
  .h-day{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer}
  .h-day .week{font-size:16px;font-weight:700;color:var(--hd-week,#000)}
  .h-day .date{font-size:13px;color:var(--hd-date,#666);margin-top:1px}
  .h-day.today .week{color:var(--hd-today,#FF5959)}
  .h-day.today .date{color:var(--hd-today,#FF5959)}
  .h-day.today::after{content:"";position:absolute;bottom:3px;width:14px;height:3px;border-radius:2px;background:var(--hd-today,#FF5959)}
  /* 新品主题(isNew)：表头大字号，颜色由主题 color 数组驱动(星期=color[0]/日期=color[1]/当天=color[3]) */
  .theme-new .h-month{font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.35)}
  .theme-new .h-day .week{font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,.35)}
  .theme-new .h-day .date{font-size:12px;text-shadow:0 1px 4px rgba(0,0,0,.35)}
  .theme-new .h-day.today::after{width:26px;height:3px;bottom:1px}
  /* 主体：整表（节次列+课程格）一体滚动，表头固定 */
  .hmain{display:flex;flex:1;overflow:hidden;position:relative;z-index:2}
  .hb-scroll{flex:1;display:flex;overflow-y:auto;height:100%;-webkit-overflow-scrolling:touch}
  .lecol{width:12.5%;flex:0 0 12.5%;background:transparent;height:calc(78px * 11)}
  .le-row{display:flex;flex-direction:column;align-items:center;justify-content:center;height:78px;border-bottom:1px solid rgba(0,0,0,.05)}
  .le-row .no{font-size:14px;font-weight:600;color:var(--hd-week,#333)}
  .le-row .tm{font-size:10px;color:var(--hd-date,#999);margin-top:1px;line-height:1.3;text-align:center}
  .theme-new .le-row{border-bottom-color:rgba(255,255,255,.18)}
  .theme-new .le-row .no{font-size:18px;text-shadow:0 1px 4px rgba(0,0,0,.35)}
  .theme-new .le-row .tm{font-size:11px;text-shadow:0 1px 4px rgba(0,0,0,.3)}
  .grid-wrap{flex:1;background:transparent;position:relative}
  .grid{position:relative;height:calc(78px * 11);touch-action:pan-y;cursor:grab}
  .grid:active{cursor:grabbing}
  .dline{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(255,255,255,.5);pointer-events:none}
  .course{position:absolute;border-radius:8px;cursor:pointer;overflow:hidden;transition:transform .08s;padding:6px 7px 5px 7px}
  .course:active{transform:scale(.98)}
  .course .cn{position:static;font-size:13px;font-weight:700;line-height:1.22;word-break:break-all;white-space:normal;overflow:visible;text-shadow:0 0 1px rgba(0,0,0,.08)}
  .course .cs{position:static;font-size:11px;font-weight:500;line-height:1.22;margin-top:3px;word-break:break-all;white-space:normal;overflow:visible}
  .course .ct{position:static;font-size:10px;margin-top:3px;line-height:1.2;opacity:.7}
  .back-week{position:fixed;right:14px;bottom:30px;background:#FF5959;color:#fff;font-size:14px;padding:8px 14px;border-radius:99px;box-shadow:0 4px 14px rgba(255,89,89,.35);cursor:pointer;display:none;z-index:30}
  .back-week.show{display:block}
  /* ============ 设置页 ============ */
  .subpage{background:#fff;padding-bottom:30px;z-index:10}
  .sub-nav{display:flex;align-items:center;height:48px;padding:0 10px;border-bottom:1px solid #F0F0F0;position:sticky;top:0;background:#fff;z-index:5}
  .sub-nav .back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .sub-nav .back svg{width:20px;height:20px}
  .sub-nav .title{flex:1;text-align:center;font-size:16px;font-weight:700;margin-right:32px}
  .set-sec{margin-top:8px}
  .set-title{font-size:14px;color:#999;padding:12px 15px 6px}
  .set-row{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid #F5F5F5;cursor:pointer}
  .set-row:active{background:#F7F8FA}
  .set-t{font-size:15px;color:#333}
  .set-s{font-size:12px;color:#999;margin-top:3px}
  .set-arrow{flex:0 0 auto}
  .set-arrow img{width:18px;height:18px;display:block;opacity:.4}
  /* ============ 主题选择页 ============ */
  .skin-body{padding:10px 15px}
  .skin-fixed{display:flex;gap:8px}
  .skin-fixed-item{flex:1}
  .def-skin{position:relative;aspect-ratio:100/211;border-radius:8px;overflow:hidden;background-size:cover;background-position:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
  .def-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(5,1fr);gap:3px;padding:6px;opacity:.85}
  .def-grid i{background:rgba(255,255,255,.35);border-radius:3px}
  .def-grid i:nth-child(1){background:#49b583}.def-grid i:nth-child(2){background:#7f86ff}.def-grid i:nth-child(3){background:#e85ec0}
  .def-grid i:nth-child(4){background:#ffbd69}.def-grid i:nth-child(5){background:#3091ff}
  .def-cap{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}

/* ============ 日期工具 ============ */
function startOfWeek(d){var t=new Date(d.getFullYear(),d.getMonth(),d.getDate());var w=t.getDay();var diff=(w===0?-6:1-w);return new Date(t.getTime()+diff*86400000);}
function addDays(d,n){return new Date(d.getTime()+n*86400000);}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function weekOfYear(d){var s=startOfWeek(new Date(d.getFullYear(),0,1));return Math.floor((startOfWeek(d).getTime()-s.getTime())/604800000)+1;}
/* 学期周次（第1周=SEMESTER_START那一周） */
function weekOfSemester(d){return Math.floor((startOfWeek(d).getTime()-startOfWeek(SEMESTER_START).getTime())/604800000)+1;}

function hexToA(hex,a){var n=parseInt(hex.replace('#',''),16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+(a/255)+')';}
function luminance(hex){var n=parseInt(hex.replace('#',''),16);return (0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))/255;}
/* 彩色与白混合，返回不透明浅色（ratio=白占比） */
function mixWhite(hex,ratio){
  var n=parseInt(hex.replace('#',''),16);
  var r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.round(r+(255-r)*ratio);g=Math.round(g+(255-g)*ratio);b=Math.round(b+(255-b)*ratio);
  return 'rgb('+r+','+g+','+b+')';
}
/* 彩色与白混合，返回不透明浅色（ratio=白占比）——原版格子为不透明浅色实底+彩边+彩字，字可清晰读出 */
function mixWhite(hex,ratio){
  var n=parseInt(hex.replace('#',''),16);
  var r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.round(r+(255-r)*ratio);g=Math.round(g+(255-g)*ratio);b=Math.round(b+(255-b)*ratio);
  return 'rgb('+r+','+g+','+b+')';
}
function buildCoursePalette(hexArr,fallback){
  var arr=(hexArr&&hexArr.length)?hexArr:fallback;
  return arr.map(function(h){return {border:h,bg:mixWhite(h,0.86),text:h};});
}

  document.getElementById("weekText").classList.toggle("red",STATE.weekOffset!==0);

  var _t=getTheme();

  ph.classList.toggle("theme-new",!!(_t&&_t.isNew));

  for(var i=1;i<=30;i++)ph.classList.remove("theme-no"+i);

}

function buildPaneBody(off){

/* ============ ViewPager 整页拖动（含表头+节次一起滑，相邻周可见） ============ */
function initSwipe(){
  var vp=document.getElementById("vp");
  var track=document.getElementById("vpTrack");
  var startX=0,startY=0,curX=0,dragging=false,axis=null;
  function moveTo(dx){
    var w=vp.offsetWidth||1;
    var pct=(dx/w*100) - STATE.curIndex*100;
    track.style.transform="translateX("+pct+"%)";
  }
  function settle(toIdx){
    STATE.weekOffset += (toIdx-STATE.curIndex);
    saveJSON(WEEK_KEY,STATE.weekOffset);
    STATE.curIndex=toIdx;
    track.style.transition="transform .25s ease";
    track.style.transform="translateX(-"+toIdx*100+"%)";
    setTimeout(function(){track.style.transition="none";render();},260);
  }
  function pickAxis(dx,dy){if(axis===null)axis=(Math.abs(dx)>Math.abs(dy))?"h":"v";return axis;}
  vp.addEventListener("touchstart",function(e){
    dragging=true;startX=e.touches[0].clientX;startY=e.touches[0].clientY;curX=startX;axis=null;
    track.style.transition="none";
  },{passive:true});
  vp.addEventListener("touchmove",function(e){
    if(!dragging)return;
    var dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;
    /* 单轴：第一次判定主轴后锁定。垂直=滚动表格(不切周)；水平=切周(禁滚动) */
    if(pickAxis(dx,dy)==="v"){return;}
    curX=e.touches[0].clientX;
    moveTo(curX-startX);
    e.preventDefault();
  },{passive:false});
  vp.addEventListener("touchend",function(e){
    if(!dragging)return;dragging=false;
    if(axis==="v")return; /* 垂直滚动结束，不切周 */
    var dx=curX-startX;
    var th=vp.offsetWidth*0.18;
    if(dx<-th)settle(STATE.curIndex+1);
    else if(dx>th)settle(STATE.curIndex-1);
    else{track.style.transition="transform .22s ease";track.style.transform="translateX(-"+STATE.curIndex*100+"%)";}
  },{passive:true});
  var mdown=false;
  vp.addEventListener("mousedown",function(e){mdown=true;dragging=true;startX=e.clientX;startY=e.clientY;curX=startX;axis=null;track.style.transition="none";e.preventDefault();});
  window.addEventListener("mousemove",function(e){
    if(!mdown)return;
    var dx=e.clientX-startX,dy=e.clientY-startY;
    if(pickAxis(dx,dy)==="v"){return;}
    curX=e.clientX;moveTo(curX-startX);
  });
  window.addEventListener("mouseup",function(e){
    if(!mdown)return;mdown=false;dragging=false;
    if(axis==="v")return;
    var dx=curX-startX;var th=vp.offsetWidth*0.18;
    if(dx<-th)settle(STATE.curIndex+1);
    else if(dx>th)settle(STATE.curIndex-1);
    else{track.style.transition="transform .22s ease";track.style.transform="translateX(-"+STATE.curIndex*100+"%)";}
  });
}

/* ============ 周次弹窗（底部弹出，原版） ============ */
function toggleWeekPop(force){
  var pop=document.getElementById("weekPop");
  var mask=document.getElementById("weekMask");
  var show=(force===undefined)?!pop.classList.contains("show"):force;
  if(show)buildWeekPop();   /* 每次打开都重建，确保本周灰/选定红状态实时反映 */
  pop.classList.toggle("show",show);
  mask.classList.toggle("show",show);
}
function buildWeekPop(){
  var pop=document.getElementById("weekPop");
  var thisWeek=weekOfSemester(new Date());
  var selWeek=thisWeek+STATE.weekOffset;
  var html='<div class="wp-head"><span class="wp-title">查看周课表</span><span class="wp-edit" id="wpEdit">修改当前周</span></div>';
  html+='<div class="wp-grid">';
  for(var i=1;i<=SEMESTER_WEEKS;i++){
    var cls="wp-cell";
    var label=i;
    if(i===selWeek){cls+=" sel";}                 /* 选定周：红色（覆盖一切） */
    else if(i===thisWeek){cls+=" cur";label="本周";} /* 本周：灰色（仅当选定≠本周） */
    html+='<div class="'+cls+'" data-w="'+i+'">'+label+'</div>';
  }
  html+='</div>';
  pop.innerHTML=html;
  pop.querySelectorAll(".wp-cell").forEach(function(el){
    el.addEventListener("click",function(e){
      e.stopPropagation();
      var w=parseInt(this.dataset.w,10);
      STATE.weekOffset=w-thisWeek;
      saveJSON(WEEK_KEY,STATE.weekOffset);
      toggleWeekPop(false);
      render();
    });
  });
  var we=document.getElementById("wpEdit");
  if(we)we.addEventListener("click",function(){showTip("修改当前周：用于设定开学日期（演示）");});
}

  document.addEventListener("click",function(e){
    var pop=document.getElementById("weekPop");
    var mask2=document.getElementById("weekMask");
    if(pop.classList.contains("show")&&!pop.contains(e.target)&&!document.getElementById("weekLabel").contains(e.target)){
      toggleWeekPop(false);
      if(mask2.classList.contains("show"))mask2.classList.remove("show");
    }
  });
  onHash();
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);
else init();

</script>
